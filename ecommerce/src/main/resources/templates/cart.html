<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cart | E-commerce</title>
    <!-- Bootstrap 5 for modern UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .cart-container {
            margin-top: 50px;
        }
        .cart-card {
            background: #fff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        h2 {
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        table th {
            background: #2575fc;
            color: #fff;
        }
        table td {
            vertical-align: middle;
        }
        .btn-danger, .btn-success {
            border-radius: 8px;
        }
        .btn-success {
            padding: 10px 20px;
            font-size: 16px;
        }
        .total-row {
            background: #f1f1f1;
            font-weight: bold;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .home-btn, .logout-btn {
            border-radius: 8px;
            padding: 8px 15px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }
        .home-btn { background: #0d6efd; }
        .home-btn:hover { background: #0b5ed7; }
        .logout-btn { background: #dc3545; }
        .logout-btn:hover { background: #bb2d3b; }
    </style>
</head>
<body>
<div class="container cart-container">

    <!-- Top Navigation -->
    <div class="top-nav">
        <a href="/user/dashboard" class="home-btn"><i class="bi bi-house-fill"></i> Home</a>
        <a href="/logout" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <div class="cart-card">
        <h2 class="text-center"><i class="bi bi-cart-fill"></i> Your Shopping Cart</h2>
        <div class="d-flex justify-content-between mb-3">
            <a href="/user/dashboard" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back to Products</a>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, stat : ${cart}">
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${item.name}"></td>
                    <td>₹ <span th:text="${item.price}"></span></td>
                    <td>
                        <a th:href="@{'/user/cart/remove/' + ${stat.index}}" class="btn btn-danger btn-sm">
                            <i class="bi bi-trash"></i> Remove
                        </a>
                    </td>
                </tr>
                </tbody>
                <tfoot>
                <tr class="total-row">
                    <td colspan="2" class="text-end">Total</td>
                    <td colspan="2">₹ <span th:text="${total}"></span></td>
                </tr>
                <tr>
                    <td colspan="4" class="text-end">
                        <a href="/user/checkout" class="btn btn-success">
                            <i class="bi bi-bag-check-fill"></i> Proceed to Checkout
                        </a>
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
</body>
</html>
