<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: Arial, sans-serif; }
        .modal-content { border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        .form-label { font-weight: 600; }
        #preview { max-height: 150px; display: none; margin-top: 10px; border-radius: 10px; border: 1px solid #ddd; }
        #progressContainer { display: none; margin-top: 10px; }
    </style>
</head>
<body class="text-center mt-5">

<!-- Trigger Button -->
<button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addProductModal">
    + Add Product
</button>

<!-- Modal -->
<div class="modal fade" id="addProductModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Alert Messages -->
                <div th:if="${success}" class="alert alert-success" role="alert">Product added successfully!</div>
                <div th:if="${error}" class="alert alert-danger" role="alert">Something went wrong. Please try again.</div>

                <!-- Form -->
                <form th:action="@{/admin/product/save}" method="post" enctype="multipart/form-data" th:object="${product}" onsubmit="startUpload(event)">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Enter product name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Price</label>
                            <input type="number" th:field="*{price}" class="form-control" placeholder="Enter price" step="0.01" min="1" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock</label>
                            <input type="number" th:field="*{stock}" class="form-control" placeholder="Enter stock" min="1" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="2" placeholder="Enter description" required></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Product Image</label>
                            <input type="file" name="imageFile" class="form-control" accept="image/*" onchange="previewImage(event)" required>
                            <img id="preview" alt="Image Preview">
                            <!-- Progress Bar -->
                            <div id="progressContainer" class="progress">
                                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3 w-100">Save Product</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function previewImage(event) {
        const preview = document.getElementById('preview');
        preview.src = URL.createObjectURL(event.target.files[0]);
        preview.style.display = 'block';
    }

    function startUpload(event) {
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        progressContainer.style.display = 'block';
        let progress = 0;
        let interval = setInterval(() => {
            progress += 10;
            progressBar.style.width = progress + '%';
            if (progress >= 100) clearInterval(interval);
        }, 200);
    }
</script>
</body>
</html>
