<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .order-card {
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }
        .order-card:hover { transform: translateY(-5px); }
        .card-header {
            background: linear-gradient(90deg, #0d6efd, #6c63ff);
            color: white;
            font-weight: bold;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        .filter-bar { margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center mb-4">All Orders</h2>
    <a href="/admin/dashboard" class="btn btn-secondary mb-3">← Back to Dashboard</a>

    <!-- Search and Filter -->
    <div class="filter-bar d-flex justify-content-between align-items-center mb-4">
        <input type="text" id="searchBox" class="form-control w-50" placeholder="Search by User Email or Order ID...">
        <select id="dateFilter" class="form-select w-25">
            <option value="">All Dates</option>
            <option value="today">Today</option>
            <option value="week">This Week</option>
            <option value="month">This Month</option>
        </select>
    </div>

    <div id="orderList">
        <div th:each="order : ${orders}" class="card order-card mb-4">
            <div class="card-header">
                Order ID: <strong th:text="${order.id}"></strong> |
                User: <span th:text="${order.userEmail}"></span> |
                Date: <span th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}"></span> |
                Total: ₹ <span th:text="${order.totalAmount}"></span>
            </div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item" th:each="item : ${order.items}">
                    <span class="fw-bold" th:text="${item.product.name}"></span> -
                    ₹<span th:text="${item.price}"></span> ×
                    <span th:text="${item.quantity}"></span>
                </li>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const searchBox = document.getElementById('searchBox');
    const orderCards = document.querySelectorAll('#orderList .card');

    searchBox.addEventListener('keyup', function () {
        let searchTerm = this.value.toLowerCase();
        orderCards.forEach(card => {
            let text = card.innerText.toLowerCase();
            card.style.display = text.includes(searchTerm) ? '' : 'none';
        });
    });
</script>
</body>
</html>
