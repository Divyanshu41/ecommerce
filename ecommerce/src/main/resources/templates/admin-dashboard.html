<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; }
        .dashboard-header { margin: 20px 0; }
        .summary-card { text-align: center; padding: 20px; border-radius: 10px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .table img { border-radius: 5px; }
        .navbar { margin-bottom: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-inverse">
    <div class="container-fluid">
        <div class="navbar-header">
            <a class="navbar-brand" href="#">Admin Panel</a>
        </div>
        <ul class="nav navbar-nav navbar-right">
            <li><a th:href="@{/admin/orders}"><span class="glyphicon glyphicon-list-alt"></span> Orders</a></li>
            <li><a th:href="@{/logout}"><span class="glyphicon glyphicon-log-out"></span> Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <h2 class="dashboard-header">Welcome to Admin Dashboard</h2>

    <!-- Summary Section -->
    <div class="row text-center">
        <div class="col-md-4">
            <div class="summary-card">
                <h4>Total Products</h4>
                <p th:text="${totalProducts}"></p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="summary-card">
                <h4>Total Orders</h4>
                <p th:text="${totalOrders}"></p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="summary-card">
                <h4>Low Stock Alerts</h4>
                <p th:text="${lowStockCount}"></p>
            </div>
        </div>
    </div>
    <br>

    <!-- Product Table -->
    <a href="/admin/product/add" class="btn btn-success mb-3">+ Add New Product</a>
    <table class="table table-bordered table-hover table-responsive">
        <thead class="bg-primary text-white">
        <tr>
            <th>ID</th><th>Name</th><th>Price</th><th>Image</th><th>Stock</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td>₹<span th:text="${product.price}"></span></td>
            <td><img th:src="@{'/images/' + ${product.imageName}}" width="100" height="80" class="img-thumbnail"/></td>
            <td th:text="${product.stock}"></td>
            <td>
                <a th:href="@{'/admin/product/edit/' + ${product.id}}" class="btn btn-primary btn-sm">Edit</a>
                <a th:href="@{'/admin/product/delete/' + ${product.id}}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
